<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sightline — try glasses on your own photo</title>
  <meta name="description" content="Upload a photo and preview eyeglasses frame styles on your own face, entirely in your browser." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="wordmark">Sightline</p>
      <h1 class="title">See how frames actually&nbsp;look on you</h1>
      <p class="subtitle">
        Upload a front-facing photo and try on a few frame styles. Everything
        runs in your browser — your photo is never sent anywhere.
      </p>
    </header>

    <div class="ruler" aria-hidden="true"></div>

    <div class="workspace">
      <section class="photo-panel" aria-label="Your photo">
        <div class="photo-stage" id="photoStage">
          <div class="empty-state" id="emptyState">
            <input class="visually-hidden" type="file" id="photoInput" accept="image/*" />
            <label class="upload-control" for="photoInput">
              <span class="upload-label">Drop a photo here</span>
              <span class="upload-hint">or click to browse. Front-facing, both eyes visible, good light works best.</span>
            </label>
          </div>
          <img class="photo" id="photo" alt="" hidden />
          <img class="frame-overlay" id="frameOverlay" alt="" hidden />
        </div>

        <div class="status-row">
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <button class="text-btn" id="replaceBtn" type="button" hidden>Replace photo</button>
        </div>
      </section>

      <section class="frame-panel" aria-label="Frame styles">
        <h2 class="panel-heading">Frame styles</h2>
        <div class="frame-grid" id="frameGrid" role="group" aria-label="Choose a frame style"></div>
        <p class="footnote">Demo frames shown here are placeholder designs, not real products.</p>
      </section>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
