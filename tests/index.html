<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sightline — unit tests</title>
  <style>
    body {
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      background: #14181a;
      color: #eef1ef;
      padding: 32px;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a7acc4;
    }
    #summary {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
    }
    #summary.pass {
      color: #4fb3a8;
    }
    #summary.fail {
      color: #e2887c;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 6px;
    }
    li.pass {
      color: #4fb3a8;
    }
    li.fail {
      color: #e2887c;
    }
    .msg {
      color: #e2887c;
      opacity: 0.85;
      margin-left: 1.4em;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <h1>Sightline unit tests</h1>
  <p id="summary">Running…</p>
  <ul id="results"></ul>
  <script type="module" src="run-tests.js"></script>
</body>
</html>
